name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Claude pushes its working branch
      pull-requests: write # ...and opens the PR itself, so it can set a linking body
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The default Claude GitHub App token deliberately has no `workflows`
          # write scope, so Claude cannot touch .github/workflows/** with it.
          # CLAUDE_GH_PAT is a PAT that *does* carry that scope; when it is
          # present Claude can edit workflow files, and this falls back to the
          # App token when it is not set.
          github_token: ${{ secrets.CLAUDE_GH_PAT }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Claude does not open PRs on its own by default -- it pushes a branch
          # and hands back a pre-filled "Create PR" link, so anything typed in
          # that link (including the "Closes #N" line) is lost if the PR gets
          # opened any other way. Allowing `gh pr create` lets it open the PR
          # directly; the "Closes #N" convention lives in CLAUDE.md.
          claude_args: '--allowed-tools "Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(npm ci),Bash(npm run lint),Bash(npm run build)"'
