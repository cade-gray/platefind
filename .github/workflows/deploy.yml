name: Deploy platefind to VPS

on:
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: platefind-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # only run when the PR was merged (not just closed)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      # No `cache-to: type=gha` here. This job runs on `pull_request: closed`,
      # whose Actions cache scope is the PR's own ref -- which no longer exists
      # once the PR is merged, so reserving a cache blob in it fails and takes
      # the whole step (and the deploy below) down with it. The build is ~10s
      # anyway. If caching is ever worth it, use a registry cache against GHCR
      # rather than type=gha, or move this job to a `push` trigger on main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cade-gray/platefind:latest
            ghcr.io/cade-gray/platefind:${{ github.sha }}

      - name: Deploy on VPS (docker compose pull + up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /srv/platefind
            docker compose pull
            docker compose up -d
            docker image prune -f
